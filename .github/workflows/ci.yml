name: CI

on:
  push:
  pull_request:

jobs:
  js:
    name: JS and CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm run build
      # build/ is committed so the plugin installs without a build step.
      # Fail if it doesn't match the source.
      - name: Committed build is up to date
        run: git diff --exit-code -- build
      - run: npm run test:js

  php:
    name: PHP, tests and demo page (WordPress ${{ matrix.wordpress }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin's stated minimum, and the latest release.
        wordpress: [ '6.7', 'latest' ]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          # The plugin's minimum, so Composer resolves what it will run on.
          php-version: '7.4'
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpcs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pin WordPress ${{ matrix.wordpress }}
        if: matrix.wordpress != 'latest'
        run: |
          echo '{ "core": "WordPress/WordPress#${{ matrix.wordpress }}" }' > .wp-env.override.json
      - name: Start wp-env
        run: npx wp-env start
      - name: Check the WordPress version
        run: npx wp-env run cli wp core version
      # A fresh environment must reach a working demo page with no manual
      # steps: activation seeds it, afterStart sets pretty permalinks.
      - name: Demo page renders the grid
        run: |
          curl -sf http://localhost:8888/posts-grid-filter-demo/ -o demo.html
          grep -q 'wmpgf-grid__card' demo.html
          grep -q 'wp-block-wmpgf-posts-filter' demo.html
      # The JavaScript side in a real browser: filtering, Back, pagination,
      # search, focus, the no-JS form, and the editor preview and controls.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Keep browser traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-wp-${{ matrix.wordpress }}
          path: test-results/
          if-no-files-found: ignore
      # Many fresh installs keep plain permalinks, where the demo page is
      # /?page_id=N and every link the plugin builds must keep page_id.
      - name: Filtered demo page works under plain permalinks
        run: |
          npx wp-env run cli wp eval "update_option( 'permalink_structure', '' ); flush_rewrite_rules( true );"
          ID=$(npx wp-env run cli wp option get wmpgf_demo_page_id 2>/dev/null | grep -oE '^[0-9]+' | head -1)
          echo "Demo page ID: $ID"
          curl -sf "http://localhost:8888/?page_id=$ID&wmpgf-category=design" -o plain-filtered.html
          grep -q 'wmpgf-grid__card' plain-filtered.html
          tr '\n' ' ' < plain-filtered.html | grep -oE '<a[^>]*wmpgf-filter__clear[^>]*>' | grep -q "page_id=$ID"
          curl -sf "http://localhost:8888/?page_id=$ID" -o plain.html
          grep -q "page_id=$ID&#038;wmpgf-page=2" plain.html
          grep -q 'name="page_id"' plain.html
      - run: npm run test:php
